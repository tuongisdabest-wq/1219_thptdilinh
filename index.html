.pq{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 14px;margin-top:8px;border:2px solid var(--line);border-radius:10px;font-weight:600;overflow:hidden;background:var(--card)}

.pc{padding:16px 18px;margin-bottom:12px}.pc h3{margin:8px 0 2px;font-size:17px;line-height:1.35}

.qz{max-width:720px;margin:0 auto}.qzt{display:flex;align-items:center;gap:12px;margin-bottom:14px}.qzt .bar{flex:1;height:8px}
.clock{font-weight:800;font-variant-numeric:tabular-nums;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.qq{font-size:19px;font-weight:700;line-height:1.5;margin:14px 0}
.qo{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:600}
.qo .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800}
.qo.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}.qo.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}.qo.no{border-color:#DC2626;background:color-mix(in srgb,#DC2626 10%,var(--card))}.qo.dim{opacity:.55}
.tfr{padding:12px 0;border-top:1px solid var(--line)}.tfb{display:flex;gap:8px;margin-top:8px}.tfb .qo{margin:0;justify-content:center}
.part{font-weight:700;margin-top:16px}.czg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:6px}.czg .qo{margin:0}
.tr{color:var(--mut);font-size:14px;margin-top:4px;font-style:italic;font-weight:500}.trv{display:block;color:var(--mut);font-size:13px;font-weight:500}
.exp{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:14px}.exp .xx{margin-top:8px;color:var(--mut)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.dots button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:700}.dots .done{background:color-mix(in srgb,var(--brand) 14%,var(--card))}.dots .cur{border:2px solid var(--brand)}
.bk{color:var(--brand)}.sm{padding:5px 12px;font-size:14px}

<script>
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',board:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',qa:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',err:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const PER=["Giữa kì 1","Cuối kì 1","Giữa kì 2","Cuối kì 2","Tốt nghiệp"];
const S={
su:{n:"Lịch sử",m:"Sử",c:"#B7791F",b:[["Cách mạng tháng Tám",14,14],["Kháng chiến chống Pháp",22,15],["Kháng chiến chống Mỹ",26,6],["Đổi mới và hội nhập",18,0]]},
dia:{n:"Địa lí",m:"Địa",c:"#0F8F6B",b:[["Vị trí địa lí",12,12],["Địa hình",20,9],["Nông nghiệp",24,3],["Vùng kinh tế",30,0]]},
ktpl:{n:"Kinh tế & Pháp luật",m:"KT",c:"#B4442C",b:[["Kinh tế thị trường",18,10],["Pháp luật",26,8],["Quyền và nghĩa vụ công dân",20,0]]},
tin:{n:"Tin học",m:"Tin",c:"#2563EB",b:[["Máy tính",15,15],["Mạng và Web",22,12],["Biểu diễn thông tin",18,4]]},
sinh:{n:"Sinh học",m:"Sinh",c:"#7C3AED",b:[["Quang hợp",16,5],["Di truyền",28,0],["Tiến hóa",20,0]]},
anh:{n:"Tiếng Anh",m:"Anh",c:"#C2410C",b:[["Education",24,18],["Reading",30,10],["Grammar",40,0]]}};
const ON=[["🦊","Minh Anh"],["🐼","Bảo Ngọc"],["🐯","Quốc Huy"],["🐰","Thu Hà"],["🐸","Đức Anh"],["🦄","Khánh Linh"],["🐧","Gia Bảo"]];
const sum=k=>S[k].b.reduce((a,x)=>({n:a.n+x[1],d:a.d+x[2]}),{n:0,d:0});
let v={p:"home",s:null,t:"bai"};
const nav=[["home","Tổng quan","home"],["subj","Môn học","book"],["board","Xếp hạng","board"],["qa","Hỏi đáp","qa"],["wrong","Sổ lỗi sai","err"]];

function chrome(){
 document.getElementById("sb").innerHTML=`<div class="brand"><i>12</i>Ôn12</div><div class="sbg">Học tập</div>`+nav.slice(0,2).map(n=>`<button class="nv ${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("")+
 Object.keys(S).map(k=>`<button class="nv ${v.s===k?"on":""}" style="font-size:14px;padding:7px 12px 7px 20px" onclick="go('subj','${k}','ov')"><span class="sico" style="--c:${S[k].c}">${si(k,14)}</span>${S[k].n}</button>`).join("")+
 `<div class="sbg">Cộng đồng</div>`+nav.slice(2).map(n=>`<button class="nv ${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("")+
 `<div class="sbs"><b>Còn 245 ngày</b>đến kỳ thi tốt nghiệp</div>`;
 document.getElementById("tb").innerHTML=nav.slice(0,4).map(n=>`<button class="${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("");

 document.getElementById("pp").innerHTML=`<b>Đang online (${ON.length})</b>`+ON.map(o=>`<div>${o[0]} ${o[1]}</div>`).join("");
 const c=v.s?`<a onclick="go('subj')">Môn học</a> / <b>${S[v.s].n}</b>`:`<b>${(nav.find(n=>n[0]===v.p)||[])[1]}</b>`;
 document.getElementById("cr").innerHTML=c}
function vHome(){
 const all=Object.keys(S).reduce((a,k)=>{const s=sum(k);return{n:a.n+s.n,d:a.d+s.d}},{n:0,d:0});
 return `<h1>Chào ${esc(user.n)}</h1><p class="sub">Hôm nay ôn tiếp để giữ chuỗi nhé.</p>
 <div class="kpis"><div class="card kpi"><small>Chuỗi học</small><b>${ST.n} ngày</b></div><div class="card kpi"><small>Tổng XP</small><b>${myTotal()}</b></div><div class="card kpi"><small>Câu đã làm</small><b>${all.d}/${all.n}</b></div><div class="card kpi"><small>Hạng trong lớp</small><b>#${gr2()}</b></div></div>
 <div class="card pad" style="margin-bottom:12px"><div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-size:30px;line-height:1.2">${myTotal()}</b><span class="sub" style="margin:0">XP tổng · cộng dồn từ tất cả các môn</span></div><div class="xs">${KS.map(k=>`<div class="xr"><span class="sico" style="--c:${S[k].c}">${si(k,13)}</span><span>${S[k].n.split(" ")[0]}</span><div class="bar" style="--c:${S[k].c}"><i style="width:${xpS(k)/Math.max(...KS.map(xpS))*100}%"></i></div><b>${xpS(k)}</b></div>`).join("")}</div></div>
 <div class="card cont"><div><small>Đang học dở</small><b>Lịch sử · Kháng chiến chống Mỹ</b><div class="bar" style="margin-top:8px;--c:${S.su.c}"><i style="width:23%"></i></div></div><button class="btn" onclick="toast('Demo: vào làm bài tiếp')">Học tiếp</button></div>
 <h2>Môn học</h2><div class="sg">${subjCards()}</div>`}
function subjCards(){return Object.keys(S).map(k=>{const s=sum(k),p=Math.round(s.d/s.n*100);return `<button class="card sj" style="--c:${S[k].c}" onclick="go('subj','${k}','bai')"><div class="r"><div class="mono">${S[k].m}</div><div><b>${S[k].n}</b><small>${S[k].b.length} bài · ${s.n} câu</small></div></div><div><div class="bar"><i style="width:${p}%"></i></div><small style="color:var(--mut)">Đã làm ${p}%</small></div></button>`}).join("")}
function vSubj(){
 if(!v.s)return `<h1>Môn học</h1><p class="sub">Chọn một môn để xem bài học và đề theo kì.</p><div class="sg">${subjCards()}</div>`;
 const k=v.s,D=S[k],s=sum(k),p=Math.round(s.d/s.n*100);
 const bai=D.b.map((b,i)=>`<div class="row"><div class="n"><b>${b[0]}</b><small>${b[1]} câu hỏi</small></div><div class="pg"><small>${b[2]}/${b[1]} câu</small><div class="bar"><i style="width:${b[2]/b[1]*100}%"></i></div></div><button class="btn o" onclick="toast('Demo: luyện tập ${b[0]}')">Luyện tập</button><button class="btn" onclick="toast('Demo: thi thử ${b[0]}')">Thi thử</button></div>`).join("");
 const ky=PER.map((n,i)=>{const bs=D.b.slice(0,Math.min(D.b.length,i+1));const q=bs.reduce((a,x)=>a+Math.round(x[1]*(i<4?.6:1)),0);return `<div class="row"><div class="n"><b>${n}</b><small>${q} câu · gồm ${bs.length} bài</small><div>${bs.map(x=>`<span class="tag">${x[0]}</span>`).join("")}</div></div><button class="btn o" onclick="toast('Demo: luyện tập ${n}')">Luyện tập</button><button class="btn" onclick="toast('Demo: thi thử ${n}')">Thi thử</button></div>`}).join("");
 return `<div class="card band" style="--c:${D.c}"><div class="mono">${D.m}</div><div><h1>${D.n}</h1><small style="color:var(--mut)">${D.b.length} bài · ${s.n} câu hỏi</small></div><div class="st"><div><b>${p}%</b><small>Hoàn thành</small></div><div><b>${s.d}</b><small>Câu đã làm</small></div><div><b>8,5</b><small>Điểm cao nhất</small></div></div></div>
 <div class="tabs" style="--c:${D.c}"><button class="${v.t==="bai"?"on":""}" onclick="go('subj','${k}','bai')">Theo bài</button><button class="${v.t==="ky"?"on":""}" onclick="go('subj','${k}','ky')">Theo kì</button></div>

 return `<h1>Xếp hạng</h1><p class="sub">Xếp theo tổng điểm XP của cả lớp.</p><div class="card">${L.map((x,i)=>`<div class="row"><b style="width:28px">${i+1}</b><span style="font-size:22px">${x[0]}</span><div class="n"><b>${x[1]}</b></div><b>${x[2]} XP</b></div>`).join("")}</div>`}

/* ===== v2: đăng nhập, cài đặt, xếp hạng ===== */
const ANI=["🦊","🐼","🐯","🐰","🐸","🦄","🐧","🐱","🐶","🦉","🐨","🐙"],ICO=["🚀","⭐","📚","🎯","🔥","🎓","💡","🏆","🎧","🌱","⚡","🧠"],BGS=["#DBEAFE","#DCFCE7","#FEF3C7","#FCE7F3","#EDE9FE","#FFE4E6","#CFFAFE","#E2E8F0"];
let user=null,AV={e:"🦊",bg:BGS[0],t:"ani"},am="reg",bd={k:"all",p:"week"};
I.set='<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>';

function authDraw(){const reg=am==="reg",nm=(document.getElementById("nm")||{}).value||"";

 <section class="af"><div class="card ac"><h1>${reg?"Tạo tài khoản":"Đăng nhập"}</h1><p class="sub" style="margin:4px 0 0">${reg?"Mất chưa đến 1 phút. Điểm và lịch sử sẽ gắn với tài khoản này.":"Chào mừng bạn quay lại."}</p>

 ${reg?genderDob():""}
 <label class="f" for="pin">Mã PIN 4 số</label><input class="in" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
 ${reg?`<label class="f" for="pin2">Nhập lại mã PIN</label><input class="in" id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••">`:""}
 <div class="er" id="er" role="alert"></div><button class="btn w">${reg?"Tạo tài khoản và vào học":"Đăng nhập"}</button></form>
 <p style="text-align:center;margin:16px 0 0;color:var(--mut)">${reg?"Đã có tài khoản?":"Chưa có tài khoản?"} <button type="button" class="lk" onclick="am='${reg?"in":"reg"}';authDraw()">${reg?"Đăng nhập":"Tạo tài khoản"}</button></p></div></section></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GN=[["nam","Nam"],["nu","Nữ"],["gay","Gay"],["les","Lesbian"],["na","Không muốn nêu"]];
let G="",DB={d:"",m:"",y:""};
const gIc=(k)=>{const M='<circle cx="10" cy="14" r="5"/><path d="M14 10l6-6M14 4h6v6"/>',F='<circle cx="12" cy="9" r="5"/><path d="M12 14v7M9 18h6"/>',w=(c,x)=>`<svg viewBox="0 0 ${x} 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`;
 return {nam:w("#2563EB",24)+M+"</svg>",nu:w("#DB2777",24)+F+"</svg>",gay:w("#0891B2",40)+M+'<g transform="translate(14 0)">'+M+"</g></svg>",les:w("#C026D3",40)+F+'<g transform="translate(14 0)">'+F+"</g></svg>",na:w("#64748B",24)+'<circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/></svg>'}[k]};

function genderDob(){const rg=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i),yrs=rg(2000,2012).reverse(),

  t15:(D.b.length?`<div class="row"><div class="n"><b>Tổng hợp cả môn</b><small>15 câu ngẫu nhiên · 15 phút</small></div>${btn("",'Làm bài',`qT15('${k}',-1)`)}</div>`:"")+D.b.map((b,i)=>`<div class="row"><div class="n"><b>${esc(b[0])}</b><small>${Math.min(15,b[1])} câu · 15 phút</small></div>${btn("",'Làm bài',`qT15('${k}',${i})`)}</div>`).join(""),
  ky:Pk.map((p,i)=>`<div class="row"><div class="n"><b>${esc(p.n)}</b><small>${kyPool(k,i).length} câu</small></div>${btn("o","Luyện tập",`qKy('${k}',${i},'pr')`)}${btn("","Vào thi",`qKy('${k}',${i},'ex')`)}</div>`).join(""),
  sai:wN(k)?`<div class="row"><div class="n"><b>${wN(k)} câu cần ôn lại</b><small>Câu làm sai ở môn ${D.n}</small></div>${btn("",'Ôn lại',`qWrong('${k}')`)}</div>`:`<div class="ph">Chưa có câu sai nào ở môn này.</div>`};
 const tiles=[["bai",pic("bai"),"Bài học",D.b.length+" bài · "+nq(k)+" câu"],["t15",pic("t15"),"Đề 15 phút",D.b.length+1+" đề kiểm tra nhanh"],["ky",pic("ky"),"Kì thi",Pk.length+" đề theo kì"],["sai",pic("sai"),"Câu sai",wN(k)+" câu cần ôn lại"]];
 return `<div class="card band" style="--c:${D.c}"><div class="mono">${si(k,30)}</div><div><h1>${D.n}</h1><small style="color:var(--mut)">${D.b.length} bài · ${nq(k)} câu hỏi</small></div><div class="st"><div><b>${xpS(k)}</b><small>XP môn này</small></div><div><b>${D.b.length}</b><small>Bài học</small></div></div></div>
 <div class="tabs" style="--c:${D.c}">${[["ov","Tổng quan"],["bai","Bài học"],["t15","Đề 15 phút"],["ky","Kì thi"],["sai","Câu sai"]].map(x=>`<button class="${t===x[0]?"on":""}" onclick="go('subj','${k}','${x[0]}')">${x[1]}</button>`).join("")}</div>
 ${t==="ov"?`<div class="tl" style="--c:${D.c}">${tiles.map(x=>`<button class="card" onclick="go('subj','${k}','${x[0]}')"><div class="ti">${x[1]}</div><div><b>${x[2]}</b><small>${x[3]}</small></div></button>`).join("")}</div>${k==="anh"?lvCard():""}`:`<div class="card">${L[t]||none}</div>${t==="bai"&&k==="anh"?lvCard():""}`}`};

/* ===== v16.4: Hỏi đáp + Bình chọn thật ===== */
let PS=null,PSK="",PD=null,LPD=0,PLL=null,LPL=0;
const mb=b=>({e:b.emoji,bg:b.bg||BGS[0],n:b.name,gv:b.gv}),agoT=t=>ago((Date.now()-t)/6e4),crw=n=>CRWN[n]||0;
function loadPosts(key){PSK=key;PS=null;api("GET","/posts?"+(R.s==="top"?"sort=top&":"")+(R.s==="open"?"status=open&":"")+(R.k!=="all"?"subject="+R.k:"")).then(j=>{if(PSK===key){PS=j.posts;draw()}}).catch(e=>{PSK="";toast(e.message)})}
function loadPost(id){LPD=id;api("GET","/posts/"+id).then(p=>{if(R.o===id){PD=p;draw()}}).catch(e=>{toast(e.message);R.o=null;draw()})}
function loadPolls(){LPL=1;api("GET","/polls"+(R.k!=="all"?"?subject="+R.k:"")).then(j=>{PLL=j;draw()}).catch(e=>{toast(e.message);PLL=[]})}
async function qv(type,id,d){try{const r=await api("POST","/vote",{type,id,value:d});
 const up=o=>{o.votes=r.votes;o.voted=r.my};if(type==="post"){(PS||[]).filter(x=>x.id===id).forEach(up);if(PD&&PD.id===id)up(PD)}else if(PD)PD.replies.filter(x=>x.id===id).forEach(up);draw()}catch(e){toast(e.message)}}
const vb2=(o,t)=>arr({my:o.voted,v:o.votes},`qv('${t[0]}',${t[1]},1)`,`qv('${t[0]}',${t[1]},-1)`);
const kids=(rs,p)=>rs.filter(r=>(r.parent_id||null)===p),dc=(rs,id)=>kids(rs,id).reduce((a,x)=>a+1+dc(rs,x.id),0);
function cmt(c,rs){const by=mb(c.by),n=dc(rs,c.id),av2=avr(by,28,crw(by.n)),head=`<div class="ch"><b>${esc(by.n)}</b>${by.gv?'<span class="gv">Giáo viên</span>':""}${c.best?'<span class="bt">✓ Đúng nhất</span>':""}<span>· ${agoT(c.created_at)}</span></div>`;
 if(R.col[c.id])return `<div class="cm"><div class="cl">${av2}</div><div class="cb">${head}<button class="lk" style="font-size:13px" onclick="tg(${c.id})">Mở rộng${n?` · ${n} phản hồi`:""}</button></div></div>`;
 const canB=PD.mine||PD.can_moderate,canD=c.mine||PD.can_moderate;
 return `<div class="cm"><div class="cl">${av2}<div class="ln" onclick="tg(${c.id})" title="Thu gọn"></div></div><div class="cb">${head}<div class="ct">${esc(c.body)}</div>
 <div class="ca">${vb2(c,["reply",c.id])}<button onclick="R.rp=${c.id};draw()">Trả lời</button>${canB?`<button onclick="qBest(${c.id},${c.best?0:1})">${c.best?"Bỏ đúng nhất":"✓ Chọn đúng nhất"}</button>`:""}${canD?`<button onclick="qDel('replies',${c.id})">Xóa</button>`:""}${c.mine?"":`<button onclick="qReport('reply',${c.id})">Báo cáo</button>`}</div>
 ${R.rp===c.id?rbox(PD.id,c.id,"Trả lời "+esc(by.n)+"…"):""}${kids(rs,c.id).map(x=>cmt(x,rs)).join("")}</div></div>`}
async function send(p,t){const el=document.getElementById("rt"+t),x=el&&el.value.trim();if(!x||x.length<2)return toast("Hãy nhập nội dung trả lời");
 try{await api("POST","/posts/"+p+"/replies",{body:x,parent_id:t==="top"?undefined:t});R.rp=null;toast("Đã gửi câu trả lời");loadPost(p)}catch(e){toast(e.message)}}
async function qBest(rid,on){try{await api("POST","/posts/"+PD.id+"/solve",{reply_id:on?rid:0});PSK="";loadPost(PD.id)}catch(e){toast(e.message)}}
async function qDel(kind,id){if(!confirm("Xóa nội dung này?"))return;try{await api("DELETE","/"+kind+"/"+id);toast("Đã xóa");if(kind==="posts"){R.o=null;PD=null;LPD=0;PSK="";draw()}else loadPost(PD.id)}catch(e){toast(e.message)}}
async function qPin(id){try{await api("POST","/posts/"+id+"/pin");PSK="";loadPost(id)}catch(e){toast(e.message)}}
async function qReport(type,id){const r=prompt("Bạn báo cáo vì lí do gì?");if(!r)return;try{await api("POST","/reports",{type,id,reason:r});toast("Đã gửi báo cáo, cảm ơn bạn")}catch(e){toast(e.message)}}
async function postQ(b){const t=at.value.trim();if(t.length<10)return void(ae.textContent="Tiêu đề cần ít nhất 10 ký tự.");b.disabled=true;
 try{await api("POST","/posts",{subject:aq.value,title:t,body:ab.value.trim()||t,anon:aa.checked});R.k="all";R.s="new";PSK="";b.closest(".mv").remove();draw();toast("Đã đăng câu hỏi")}catch(e){ae.textContent=e.message;b.disabled=false}}
async function postPoll(b){const t=pt.value.trim(),os=[...document.querySelectorAll(".po-i")].map(x=>x.value.trim()).filter(Boolean);
 if(t.length<8)return void(pe.textContent="Câu hỏi cần ít nhất 8 ký tự.");if(os.length<2)return void(pe.textContent="Cần ít nhất 2 lựa chọn.");b.disabled=true;
 try{await api("POST","/polls",{subject:pk2.value,title:t,options:os,days:+pd.value});R.tab="p";PLL=null;LPL=0;b.closest(".mv").remove();draw();toast("Đã đăng bình chọn")}catch(e){pe.textContent=e.message;b.disabled=false}}
async function pv(id,i){const p=PLL.find(x=>x.id===id),nw=p.my===i?-1:i;try{await api("POST","/polls/"+id+"/vote",{opt:nw});if(p.my>=0)p.options[p.my].n--;if(nw>=0)p.options[nw].n++;p.my=nw;draw()}catch(e){toast(e.message)}}
async function pDel(id){if(!confirm("Xóa bình chọn này?"))return;try{await api("DELETE","/polls/"+id);PLL=null;LPL=0;draw()}catch(e){toast(e.message)}}
function pollCard(p){const T=p.options.reduce((a,o)=>a+o.n,0),show=p.my>=0||p.closed||R.pr[p.id],mx=Math.max(...p.options.map(o=>o.n)),by=mb(p.by),dl=Math.max(0,Math.ceil((p.ends_at-Date.now())/864e5));
 return `<div class="card pc">${TG(p.subject||"chung")}<span class="bdg" style="margin-left:6px">${p.closed?"Đã đóng":"Còn "+dl+" ngày"}</span><h3>${esc(p.title)}</h3>
 ${p.options.map((o,i)=>{const pc=T?Math.round(o.n/T*100):0;return `<button class="pq ${p.my===i?"on":""}" ${p.closed?"disabled":""} onclick="pv(${p.id},${i})">${show?`<i style="width:${pc}%"></i>`:""}<span>${p.my===i?"✓ ":""}${esc(o.t)}</span>${show?`<b>${pc}%${o.n===mx&&T?" 🏆":""}</b>`:""}</button>`}).join("")}
 <div class="mt">${avr(by,22,crw(by.n))}<span>${esc(by.n)}</span><span>· ${agoT(p.created_at)}</span><span>· ${T} lượt bình chọn</span>${show?"":`<button class="lk" style="font-size:13px" onclick="R.pr[${p.id}]=1;draw()">Xem kết quả</button>`}${p.mine?`<button class="lk" style="font-size:13px" onclick="pDel(${p.id})">Xóa</button>`:""}</div></div>`}
vQA=function(){
 const ch=(on,fn,l)=>`<button class="chip ${on?"on":""}" onclick="${fn}">${l}</button>`,load=`<div class="card ph">Đang tải…</div>`;
 if(R.o){if(!PD||PD.id!==R.o){if(LPD!==R.o)loadPost(R.o);return `<button class="lk" onclick="R.o=null;PD=null;LPD=0;draw()">← Quay lại danh sách</button>${load}`}
  const p=PD,n=p.replies.length,roots=kids(p.replies,null),by=mb(p.by);
  return `<button class="lk" onclick="R.o=null;PD=null;LPD=0;draw()">← Quay lại danh sách</button><div class="card po" style="margin-top:12px;cursor:default"><div class="vt">${vb2(p,["post",p.id])}</div><div class="bd">${TG(p.subject)}${p.status==="solved"?'<span class="sv">✓ Đã giải đáp</span>':""}${p.pinned?'<span class="bdg" style="margin-left:4px">📌 Ghim</span>':""}<h1 style="font-size:22px;margin:8px 0">${esc(p.title)}</h1><div class="ct">${esc(p.body)}</div>
  <div class="mt">${avr(by,24,crw(by.n))}<span>${esc(by.n)}</span>${by.gv?'<span class="gv">Giáo viên</span>':""}<span>· ${agoT(p.created_at)}</span>${p.can_moderate?`<button class="lk" style="font-size:13px" onclick="qPin(${p.id})">${p.pinned?"Bỏ ghim":"Ghim"}</button>`:""}${p.mine||p.can_moderate?`<button class="lk" style="font-size:13px" onclick="qDel('posts',${p.id})">Xóa bài</button>`:`<button class="lk" style="font-size:13px" onclick="qReport('post',${p.id})">Báo cáo</button>`}</div></div></div>
  <div class="card pad" style="margin-top:14px"><h3>Câu trả lời của bạn</h3>${rbox(p.id,"top","Chia sẻ cách bạn hiểu…")}</div><h2>${n} câu trả lời</h2>${n?roots.map(c=>cmt(c,p.replies)).join(""):`<div class="card ph">Chưa có ai trả lời. Hãy là người đầu tiên!</div>`}`}
 const seg=`<div class="seg" style="max-width:340px;margin:16px 0 0"><button class="${R.tab==="q"?"on":""}" onclick="R.tab='q';draw()">Câu hỏi</button><button class="${R.tab==="p"?"on":""}" onclick="R.tab='p';draw()">Bình chọn</button></div>`,
  topics=`<div class="chips tp" style="margin-top:14px">${TO.map(t=>ch(R.k===t[0],`R.k='${t[0]}';PSK='';PLL=null;LPL=0;draw()`,t[1])).join("")}</div>`,
  head=`<div class="qa-h"><div><h1>Hỏi đáp</h1><p class="sub" style="margin-bottom:0">Hỏi theo chủ đề, bình chọn và trả lời cùng cả lớp.</p></div><button class="btn" onclick="${R.tab==="q"?"ask()":"newPoll()"}">${R.tab==="q"?"+ Đặt câu hỏi":"+ Tạo bình chọn"}</button></div>`;
 if(R.tab==="p"){if(PLL===null&&!LPL)loadPolls();return head+seg+topics+(PLL===null?load:PLL.length?PLL.map(pollCard).join(""):`<div class="card ph">Chưa có bình chọn nào ở mục này.</div>`)}
 const key=R.k+R.s;if(PSK!==key)loadPosts(key);
 const sorts=`<div class="chips">${[["hot","Nổi bật"],["new","Mới nhất"],["top","Bình chọn cao"],["open","Chưa giải đáp"]].map(t=>ch(R.s===t[0],`R.s='${t[0]}';draw()`,t[1])).join("")}</div>`;
 if(!PS)return head+seg+topics+sorts+load;
 const L=PS.slice(),sc=p=>p.votes+p.replies*2-(Date.now()-p.created_at)/18e6;if(R.s==="hot"||R.s==="open")L.sort((a,b)=>(b.pinned-a.pinned)||(sc(b)-sc(a)));
 return head+seg+topics+sorts+(L.length?L.map(p=>{const by=mb(p.by);return `<div class="card po" onclick="R.o=${p.id};PD=null;LPD=0;draw();window.scrollTo(0,0)"><div class="vt">${vb2(p,["post",p.id])}</div><div class="bd">${TG(p.subject)}${p.status==="solved"?'<span class="sv">✓ Đã giải đáp</span>':""}${p.pinned?'<span class="bdg" style="margin-left:4px">📌 Ghim</span>':""}<h3>${esc(p.title)}</h3><div class="sn">${esc(p.body)}</div><div class="mt">${avr(by,22,crw(by.n))}<span>${esc(by.n)}</span>${by.gv?'<span class="gv">Giáo viên</span>':""}<span>· ${agoT(p.created_at)}</span><span>· 💬 ${p.replies}</span></div></div></div>`}).join(""):`<div class="card ph">Chưa có câu hỏi nào ở mục này.</div>`)};
R.tab="q";R.pr={};
function draw(){chrome();document.getElementById("app").innerHTML=({home:vHome,subj:vSubj,board:vBoard,set:vSet,quiz:vQuiz,qa:vQA,wrong:vWrong})[v.p]()}

boot();

</script>
