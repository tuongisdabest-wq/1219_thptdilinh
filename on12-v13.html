Câu 1. [Chọn nghĩa đúng] Từ 'scholarship' có nghĩa là gì?
A. Học phí
*B. Học bổng
C. Bằng cấp
D. Kỳ thi
> Gợi ý: Từ này gắn với việc được nhận hỗ trợ để đi học.
> Giải thích: scholarship = học bổng.

Câu 2. [Từ đồng nghĩa] Choose the word closest in meaning to 'enormous'.
A. tiny
*B. huge
C. quiet
D. ancient
> Dịch: Chọn từ có nghĩa gần nhất với 'enormous'.
> Dịch đáp án: nhỏ xíu | rất to | yên tĩnh | cổ xưa
> Gợi ý: enormous dùng để nói về thứ có kích thước rất lớn.
> Giải thích: enormous = huge (rất lớn).
> Giải thích kỹ: Đồng nghĩa là hai từ có nghĩa gần giống nhau. enormous = rất to; tiny là nhỏ xíu (ngược nghĩa); quiet là yên tĩnh; ancient là cổ xưa. Chỉ huge cũng là rất to.
