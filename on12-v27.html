.hs{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));font-weight:700}
.hxp{font-family:var(--fh);font-weight:700;color:var(--ok);white-space:nowrap}

/* Xếp hạng */
.pod2{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:14px 0 16px}
.pi2{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center}
.pi2 b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;margin-top:4px}
.pi2 small{color:var(--mut);font-weight:800;font-size:12.5px}
.bs2{width:100%;margin-top:8px;border-radius:14px 14px 0 0;display:grid;place-items:center;color:#fff;font-size:26px;border-bottom:4px solid rgba(0,0,0,.18)}
.r1 .bs2{height:92px;background:#F5B800}.r2 .bs2{height:66px;background:#A8B4C4}.r3 .bs2{height:48px;background:#CD7F32}
.mymy{display:flex;align-items:center;gap:14px;padding:12px 16px;margin:6px 0 4px;border-color:var(--brand);background:var(--soft)}
.mymy .mr{font-size:26px;color:var(--brand);min-width:52px}.mymy b{display:block}.mymy small{color:var(--mut);font-weight:700}
.lb{padding:4px 0;overflow:hidden}
.lbr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:2px solid var(--line)}
.lbr:first-child{border-top:0}
.lbr.mine{background:var(--soft)}
.lbr .n{flex:1;min-width:0}.lbr .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr small{color:var(--mut);font-weight:700;font-size:12px}
.rk2{width:30px;text-align:center;font-size:18px;color:var(--mut);flex:none}
.rk2.g1{color:#F5B800}.rk2.g2{color:#8E9BAD}.rk2.g3{color:#CD7F32}
.xpv{font-size:18px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}.xpv small{margin-left:3px;font-size:11px;color:var(--mut)}
.sp{flex:none}
@media(max-width:899px){.bgd{grid-template-columns:1fr}}

/* Hỏi đáp */
.po{border:2px solid var(--line);border-bottom-width:4px;border-radius:18px;margin-bottom:12px}
.po:hover{border-color:var(--brand)}
.po:active{transform:translateY(2px);border-bottom-width:2px}
.vt{background:var(--soft);width:54px;gap:4px}
.vb{border-radius:10px;width:34px;height:30px;color:var(--mut);font-size:15px}
.vb.up{color:var(--org);background:color-mix(in srgb,var(--org) 14%,transparent)}.vb.dn{color:var(--k1)}
.po .bd{padding:14px 16px}.po h3{font-size:17px}
.mt{font-weight:700}
.qa-h .btn{white-space:nowrap}

/* Bình chọn */
.pc{border-radius:20px}
.pq{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;margin-top:10px;font-weight:800}
.pq i{background:color-mix(in srgb,var(--brand) 20%,var(--card))}
.pq.on{border-color:var(--brand);color:var(--brand);background:var(--soft)}
.pq:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.pq b{font-family:var(--fh);font-weight:700}

/* Tường tâm sự */
.wall{columns:2;column-gap:14px}
.note{break-inside:avoid;margin:0 0 14px;padding:16px 14px 10px;border-radius:6px 6px 14px 6px;background:var(--nb);color:#2F2A1E;transform:rotate(var(--r));box-shadow:0 4px 0 rgba(0,0,0,.14);position:relative}
.note:before{content:"";position:absolute;top:-7px;left:50%;width:46px;height:14px;margin-left:-23px;border-radius:3px;background:rgba(255,255,255,.65);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note p{margin:0 0 10px;font-weight:700;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.nf{display:flex;align-items:center;gap:8px;font-size:12px;color:#5C5440;font-weight:800}
.nh{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.55);color:#5C5440;font-weight:800}
.nh svg{width:16px;height:16px;fill:none;stroke:#E0426B;stroke-width:2;stroke-linejoin:round}
.nh.on svg{fill:#FF4B4B;stroke:#FF4B4B}
.nt{flex:1}.nx{color:#5C5440;text-decoration:underline;font-weight:800;font-size:12px}
.wcl{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap}
.wc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px var(--line)}
.wc.on{border-color:var(--ink)}
@media(max-width:420px){.wall{columns:1}}

/* Sinh nhật */
.bday{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border-color:color-mix(in srgb,var(--org) 50%,var(--line));background:color-mix(in srgb,var(--org) 10%,var(--card))}
.bday .bi{font-size:28px}.bday>div:not(.bav){flex:1;min-width:0}.bday small{display:block;color:var(--mut);font-weight:700}
.bday.me{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--card))}
.bav{display:flex}.bav .av{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}.bav .av:first-child{margin-left:0}

/* Đếm ngược */
.cdw{text-align:center}
.cdg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cdg div{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 4px 8px;background:var(--bg)}
.cdg b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--brand)}
.cdg small{font-weight:800;color:var(--mut);font-size:12px}
.cdb{margin-top:16px;height:14px}.cdb i{background:var(--g)}
.cdq{display:flex;gap:12px;align-items:center;margin-top:14px;border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--soft)}
.cdq p{margin:0;font-weight:800;font-size:16px;line-height:1.4}.cdi{font-size:26px}
.cdw+.cdq+.card{margin-top:14px}
@media(max-width:420px){.cdg b{font-size:28px}}
.hbtg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin:0 0 12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--card)}
.hbtg.on{border-color:var(--org);background:color-mix(in srgb,var(--org) 10%,var(--card))}
.hbtg span{flex:1;font-weight:800;line-height:1.3}.hbtg small{display:block;color:var(--mut);font-weight:700}

/* Học bá: đồng hồ từng câu */
.hbt{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:-4px 0 12px}
.hbt i{display:block;height:100%;background:var(--org);border-radius:999px;transition:width 1s linear}
.clock.hbc{color:var(--org);border-color:var(--org);min-width:44px;text-align:center}
.clock.hbc.hot{color:var(--bad);border-color:var(--bad);animation:hbp .5s infinite alternate}
@keyframes hbp{to{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.clock.hbc.hot{animation:none}}

/* Đăng nhập */
.ac{border:2px solid var(--line);border-bottom-width:4px;border-radius:24px}
.ab{background:color-mix(in srgb,var(--g) 9%,var(--card))}
label.f{font-weight:800}
.in{border-width:2px;border-bottom-width:4px;border-radius:14px}
.btn.w{width:100%;padding:14px;margin-top:6px}
.pinr{position:relative;display:flex;gap:10px}
.pinr input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;z-index:2;cursor:text}
.pb{flex:1;height:58px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--card);display:grid;place-items:center;transition:border-color .12s,background .12s}
.pb.f:after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink)}
.pb.a{border-color:var(--brand);background:var(--soft)}
.pinr.shk{animation:shk .5s}
.pinr.shk .pb{border-color:var(--bad);background:var(--badbg)}
.er{font-weight:700}

/* v27: Đếm ngược theo demo + Tường tâm sự ở tab Đếm ngược */
.cdh{display:flex;align-items:center;gap:12px;margin-bottom:14px;text-align:left}
.cdh .ic{width:40px;height:40px;border-radius:12px;background:#8b5cf6;color:#fff;display:grid;place-items:center;flex:none}
.cdh .ic svg{width:22px;height:22px}
.cdh b{display:block;font-size:17px;font-family:var(--fh)}.cdh small{color:var(--mut);font-weight:700}
.cdr{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut);font-weight:800;font-size:13px}
.tmsg{margin:12px 0 0;font-weight:800;font-size:16px;line-height:1.4;text-align:left}
.wsec{margin:22px 0 10px}.wsec h3{margin:0;font-size:20px}.wsec small{color:var(--mut);font-weight:700}
.wcmp .in{display:block;width:100%;margin:0 0 10px}.wcmp textarea.in{resize:none}
.wct{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-weight:700;margin:-4px 0 10px}
.wcmp .wcl{margin:12px 0}.wcn{font-weight:800;color:var(--mut);font-size:13px;margin-right:6px;align-self:center}
.note .nq{font-weight:900;margin:0 0 6px;font-family:var(--fh)}
.wcmp .wcl{display:flex;flex-wrap:nowrap;align-items:center;gap:8px}.wcmp .wc{width:32px;height:32px;flex:none}
#tb button{white-space:nowrap;font-size:11px;letter-spacing:-.2px}
</style>
</head>
<body>
<div class="app">
 <aside id="sb"></aside>
 <div class="col">
  <div class="top"><div class="crumb" id="cr"></div>
   <span class="stk" id="stk"></span>
   <div class="onl"><button class="onb" onclick="document.getElementById('pp').classList.toggle('open')" aria-label="Xem ai đang online"><i class="dot"></i><span id="onn"></span></button>
    <div class="pop" id="pp"></div></div>
   <button class="av" id="meb" onclick="go('set')" aria-label="Cài đặt tài khoản"></button></div>
  <main id="app"></main>
 </div>
</div>
<nav class="tb" id="tb"></nav>
<div id="au"></div>
<script>
const I={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/>',board:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>',qa:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',err:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const PER=["Giữa kì 1","Cuối kì 1","Giữa kì 2","Cuối kì 2","Tốt nghiệp"];
const S={
su:{n:"Lịch sử",m:"Sử",c:"#B7791F",b:[["Cách mạng tháng Tám",14,14],["Kháng chiến chống Pháp",22,15],["Kháng chiến chống Mỹ",26,6],["Đổi mới và hội nhập",18,0]]},
dia:{n:"Địa lí",m:"Địa",c:"#0F8F6B",b:[["Vị trí địa lí",12,12],["Địa hình",20,9],["Nông nghiệp",24,3],["Vùng kinh tế",30,0]]},
ktpl:{n:"Kinh tế & Pháp luật",m:"KT",c:"#B4442C",b:[["Kinh tế thị trường",18,10],["Pháp luật",26,8],["Quyền và nghĩa vụ công dân",20,0]]},
tin:{n:"Tin học",m:"Tin",c:"#2563EB",b:[["Máy tính",15,15],["Mạng và Web",22,12],["Biểu diễn thông tin",18,4]]},
sinh:{n:"Sinh học",m:"Sinh",c:"#7C3AED",b:[["Quang hợp",16,5],["Di truyền",28,0],["Tiến hóa",20,0]]},
anh:{n:"Tiếng Anh",m:"Anh",c:"#C2410C",b:[["Education",24,18],["Reading",30,10],["Grammar",40,0]]}};
const ON=[["🦊","Minh Anh"],["🐼","Bảo Ngọc"],["🐯","Quốc Huy"],["🐰","Thu Hà"],["🐸","Đức Anh"],["🦄","Khánh Linh"],["🐧","Gia Bảo"]];
const sum=k=>S[k].b.reduce((a,x)=>({n:a.n+x[1],d:a.d+x[2]}),{n:0,d:0});
let v={p:"home",s:null,t:"bai"};
const nav=[["home","Tổng quan","home"],["subj","Môn học","book"],["board","Xếp hạng","board"],["qa","Hỏi đáp","qa"],["wrong","Sổ lỗi sai","err"]];
function go(p,s,t){v={p,s:s||null,t:t||v.t||"bai"};document.getElementById("pp").classList.remove("open");draw();window.scrollTo(0,0)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
const act=(p)=>v.p===p||(p==="subj"&&v.p==="subj"&&v.s);
function chrome(){
 document.getElementById("sb").innerHTML=`<div class="brand"><i>12</i>Ôn12</div><div class="sbg">Học tập</div>`+nav.slice(0,2).map(n=>`<button class="nv ${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("")+
 Object.keys(S).map(k=>`<button class="nv ${v.s===k?"on":""}" style="font-size:14px;padding:7px 12px 7px 20px" onclick="go('subj','${k}','ov')"><span class="sico" style="--c:${S[k].c}">${si(k,14)}</span>${S[k].n}</button>`).join("")+
 `<div class="sbg">Cộng đồng</div>`+nav.slice(2).map(n=>`<button class="nv ${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("")+
 `<div class="sbs"><b>Còn 245 ngày</b>đến kỳ thi tốt nghiệp</div>`;
 document.getElementById("tb").innerHTML=nav.slice(0,4).map(n=>`<button class="${v.p===n[0]?"on":""}" onclick="go('${n[0]}')">${ic(n[2])}${n[1]}</button>`).join("");
 document.getElementById("onn").textContent=ON.length+" đang online";
 document.getElementById("pp").innerHTML=`<b>Đang online (${ON.length})</b>`+ON.map(o=>`<div>${o[0]} ${o[1]}</div>`).join("");
 const c=v.s?`<a onclick="go('subj')">Môn học</a> / <b>${S[v.s].n}</b>`:`<b>${(nav.find(n=>n[0]===v.p)||[])[1]}</b>`;
 document.getElementById("cr").innerHTML=c}
function vHome(){
 const all=Object.keys(S).reduce((a,k)=>{const s=sum(k);return{n:a.n+s.n,d:a.d+s.d}},{n:0,d:0});
 return `<h1>Chào ${esc(user.n)}</h1><p class="sub">Hôm nay ôn tiếp để giữ chuỗi nhé.</p>
 <div class="kpis"><div class="card kpi"><small>Chuỗi học</small><b>${ST.n} ngày</b></div><div class="card kpi"><small>Tổng XP</small><b>${myTotal()}</b></div><div class="card kpi"><small>Câu đã làm</small><b>${all.d}/${all.n}</b></div><div class="card kpi"><small>Hạng trong lớp</small><b>#${gr2()}</b></div></div>
 <div class="card pad" style="margin-bottom:12px"><div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-size:30px;line-height:1.2">${myTotal()}</b><span class="sub" style="margin:0">XP tổng · cộng dồn từ tất cả các môn</span></div><div class="xs">${KS.map(k=>`<div class="xr"><span class="sico" style="--c:${S[k].c}">${si(k,13)}</span><span>${S[k].n.split(" ")[0]}</span><div class="bar" style="--c:${S[k].c}"><i style="width:${xpS(k)/Math.max(...KS.map(xpS))*100}%"></i></div><b>${xpS(k)}</b></div>`).join("")}</div></div>
 <div class="card cont"><div><small>Đang học dở</small><b>Lịch sử · Kháng chiến chống Mỹ</b><div class="bar" style="margin-top:8px;--c:${S.su.c}"><i style="width:23%"></i></div></div><button class="btn" onclick="toast('Demo: vào làm bài tiếp')">Học tiếp</button></div>
 <h2>Môn học</h2><div class="sg">${subjCards()}</div>`}
function subjCards(){return Object.keys(S).map(k=>{const s=sum(k),p=Math.round(s.d/s.n*100);return `<button class="card sj" style="--c:${S[k].c}" onclick="go('subj','${k}','bai')"><div class="r"><div class="mono">${S[k].m}</div><div><b>${S[k].n}</b><small>${S[k].b.length} bài · ${s.n} câu</small></div></div><div><div class="bar"><i style="width:${p}%"></i></div><small style="color:var(--mut)">Đã làm ${p}%</small></div></button>`}).join("")}
function vSubj(){
 if(!v.s)return `<h1>Môn học</h1><p class="sub">Chọn một môn để xem bài học và đề theo kì.</p><div class="sg">${subjCards()}</div>`;
 const k=v.s,D=S[k],s=sum(k),p=Math.round(s.d/s.n*100);
 const bai=D.b.map((b,i)=>`<div class="row"><div class="n"><b>${b[0]}</b><small>${b[1]} câu hỏi</small></div><div class="pg"><small>${b[2]}/${b[1]} câu</small><div class="bar"><i style="width:${b[2]/b[1]*100}%"></i></div></div><button class="btn o" onclick="toast('Demo: luyện tập ${b[0]}')">Luyện tập</button><button class="btn" onclick="toast('Demo: thi thử ${b[0]}')">Thi thử</button></div>`).join("");
 const ky=PER.map((n,i)=>{const bs=D.b.slice(0,Math.min(D.b.length,i+1));const q=bs.reduce((a,x)=>a+Math.round(x[1]*(i<4?.6:1)),0);return `<div class="row"><div class="n"><b>${n}</b><small>${q} câu · gồm ${bs.length} bài</small><div>${bs.map(x=>`<span class="tag">${x[0]}</span>`).join("")}</div></div><button class="btn o" onclick="toast('Demo: luyện tập ${n}')">Luyện tập</button><button class="btn" onclick="toast('Demo: thi thử ${n}')">Thi thử</button></div>`}).join("");
 return `<div class="card band" style="--c:${D.c}"><div class="mono">${D.m}</div><div><h1>${D.n}</h1><small style="color:var(--mut)">${D.b.length} bài · ${s.n} câu hỏi</small></div><div class="st"><div><b>${p}%</b><small>Hoàn thành</small></div><div><b>${s.d}</b><small>Câu đã làm</small></div><div><b>8,5</b><small>Điểm cao nhất</small></div></div></div>
 <div class="tabs" style="--c:${D.c}"><button class="${v.t==="bai"?"on":""}" onclick="go('subj','${k}','bai')">Theo bài</button><button class="${v.t==="ky"?"on":""}" onclick="go('subj','${k}','ky')">Theo kì</button></div>
 <div class="card">${v.t==="bai"?bai:ky}</div>`}
function vBoard(){const L=[["🦊","Minh Anh",820],["🐼","Bảo Ngọc",760],["🐯","Quốc Huy",690],["🐰","Thu Hà",610],["🐸","Đức Anh",540]];
 return `<h1>Xếp hạng</h1><p class="sub">Xếp theo tổng điểm XP của cả lớp.</p><div class="card">${L.map((x,i)=>`<div class="row"><b style="width:28px">${i+1}</b><span style="font-size:22px">${x[0]}</span><div class="n"><b>${x[1]}</b></div><b>${x[2]} XP</b></div>`).join("")}</div>`}
const vPh=t=>`<h1>${t}</h1><div class="card ph" style="margin-top:16px">Màn này giữ như bản hiện tại, sẽ làm lại sau khi chốt phần Môn học.</div>`;
function draw(){chrome();document.getElementById("app").innerHTML=v.p==="home"?vHome():v.p==="subj"?vSubj():v.p==="board"?vBoard():vPh(v.p==="qa"?"Hỏi đáp":"Sổ lỗi sai")}

  <div class="wct"><span>Tối thiểu 5 ký tự</span><span id="wtc">${WC.tx.length}/140</span></div>
  <button class="tgl" style="width:100%;text-align:left" onclick="wcAn(this)"><span>Đăng ẩn danh<small>Cả lớp không thấy tên, admin vẫn thấy.</small></span><i class="sw3 ${WC.an?"on":""}"></i></button>
  <div class="wcl" id="wcl"><span class="wcn">Màu giấy</span>${WCOL.map((c,i)=>`<button type="button" class="wc ${i===WC.col?"on":""}" style="background:${c}" aria-label="Màu ${i+1}" onclick="wcCol(this,${i})"></button>`).join("")}</div>
  <div class="er" id="wer" role="alert"></div><button class="btn" id="wbtn" style="width:100%" onclick="wPost()">Dán lên tường</button></div>`;
 if(!WALL){if(!WLK)loadWall();return head+cmp+LOAD24}
 if(WALL.err)return head+offBox("Tường tâm sự",WALL.err);
 if(!WALL.rows.length)return head+cmp+`<div class="card ph">Tường còn trống. Hãy dán tờ giấy nhớ đầu tiên!</div>`;
 return head+cmp+`<div class="wall">${WALL.rows.map(n=>{const c=WCOL[(+n.color||0)%WCOL.length],rot=((n.id*7)%5)-2,nm=(n.name&&!(+n.anon))?esc(n.name):"Ẩn danh";
  return `<div class="note" style="--nb:${c};--r:${rot}deg">${n.slogan?`<div class="nq">“${esc(n.slogan)}”</div>`:""}<p>${esc(n.body)}</p><div class="nf"><button class="nh ${n.hearted?"on":""}" onclick="wHeart(${n.id})" aria-label="Thả tim"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.4 5c2 0 3.6 1.1 5.6 3.3C14 6.1 15.600 5 17.600 5 21 5 22.800 8.600 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg>${n.hearts||0}</button><span class="nt">${nm} · ${agoT(n.created_at)}</span>${n.mine?`<button class="nx" onclick="wDel(${n.id})">Xóa</button>`:`<button class="nx" onclick="wRep(${n.id})">Báo cáo</button>`}</div></div>`}).join("")}</div>`}
async function wHeart(id){const n=WALL&&WALL.rows.find(x=>x.id===id);if(!n)return;const was=n.hearted;n.hearted=!was;n.hearts=(n.hearts||0)+(was?-1:1);draw();
 try{const r=await api("POST","/wall/"+id+"/heart");if(r&&r.hearts!=null){n.hearts=r.hearts;n.hearted=!!r.hearted;draw()}}catch(e){n.hearted=was;n.hearts=(n.hearts||0)+(was?1:-1);draw();toast(e.message)}}
function wRep(id){pr2("Bạn báo cáo vì lí do gì?",async r=>{try{await api("POST","/wall/"+id+"/report",{reason:r});toast("Đã gửi báo cáo")}catch(e){toast(e.message)}})}
function wDel(id){cf("Xóa tâm sự này?",async()=>{try{await api("DELETE","/wall/"+id);WALL=null;WLK=0;toast("Đã xóa");draw()}catch(e){toast(e.message)}},"Xóa")}

/* ---------- Xếp hạng ---------- */
vBoard=function(){const key=bd.k+bd.p,ch=(on,fn,l)=>`<button class="chip ${on?"on":""}" onclick="${fn}">${l}</button>`;
 const head=`<h1>Xếp hạng</h1><p class="sub">${bd.k==="all"?"Tổng XP tất cả các môn":"XP môn "+S[bd.k].n}. Top 3 tổng XP được gắn vương miện ở avatar.</p><div class="chips tp">${ch(bd.k==="all","bd.k='all';draw()","Tổng XP")}${KS.map(x=>ch(bd.k===x,`bd.k='${x}';draw()`,S[x].n)).join("")}</div><div class="chips">${[["week","Tuần này"],["month","Tháng này"],["all","Tất cả"]].map(p=>ch(bd.p===p[0],`bd.p='${p[0]}';draw()`,p[1])).join("")}</div>`;
 if(!BOARD||BOARD.key!==key){if(LBK!==key)loadBoard(key);return head+LOAD24}
 const R=BOARD.rows,pa=r=>({e:r.emoji,bg:r.bg||BGS[0]});
 if(!R.length)return head+`<div class="card ph">Chưa có ai làm bài trong khoảng này.</div>`;
 const mi=R.findIndex(r=>r.me);
 const pod=R.length>=3?`<div class="pod2">${[1,0,2].map(i=>{const o=R[i];return `<div class="pi2 r${i+1}">${avr(pa(o),i===0?64:50,o.crown)}<b>${esc(o.name)}</b><small>${o.xp} XP</small><div class="bs2"><span>${i+1}</span></div></div>`}).join("")}</div>`:"";
 let tip="";if(mi>0)tip=` Còn ${R[mi-1].xp-R[mi].xp+1} XP để lên hạng ${mi}.`;else if(mi===0&&R.length>1)tip=" Bạn đang dẫn đầu lớp!";
 const mine=mi>=0?`<div class="card mymy"><span class="mr">#${mi+1}</span><div><b>Hạng của bạn</b><small>${R[mi].xp} XP.${tip}</small></div></div>`:"";
 const list=`<div class="card lb">${R.map((o,i)=>`<div class="lbr ${o.me?"mine":""}"><span class="rk2 ${i<3?"g"+(i+1):""}">${i+1}</span>${avr(pa(o),40,o.crown)}<div class="n"><b>${esc(o.name)}${o.me?" (bạn)":""}</b><small>${o.n} bài · 🔥 ${o.streak}</small></div><span class="sp hm">${spark(o.trend)}</span><span class="xpv">${o.xp}<small>XP</small></span></div>`).join("")}</div>`;
 const tr=Array(7).fill(0);R.forEach(r=>(r.trend||[]).forEach((x,i)=>tr[i]+=x));const mx=Math.max(1,...tr),DN=["CN","T2","T3","T4","T5","T6","T7"];
 const side=`<div style="display:grid;gap:16px;align-content:start"><div class="card pad"><h3>XP của bạn</h3><div class="big">${TOT}<span class="sub" style="font-size:14px;font-weight:600;margin-left:6px">XP tổng${mi>=0?" · hạng "+(mi+1):""}</span></div><div style="margin-top:8px">${KS.map(x=>`<div class="hb"><span>${S[x].n.split(" ")[0]}</span><div class="bar" style="--c:${S[x].c}"><i style="width:${xpS(x)/Math.max(1,...KS.map(xpS))*100}%"></i></div><b>${xpS(x)}</b></div>`).join("")}</div></div>
 <div class="card pad"><h3>XP cả lớp 7 ngày qua</h3><div class="col7">${tr.map((x,i)=>`<div><i style="height:${x/mx*80}px"></i>${DN[new Date(Date.now()-(6-i)*864e5).getDay()]}</div>`).join("")}</div></div></div>`;
 return head+mine+pod+`<div class="bgd">${list}${side}</div>`};

/* ---------- Đăng nhập: PIN 4 ô ---------- */
const pinBox=(id,lb)=>`<label class="f" for="${id}">${lb}</label><div class="pinr" id="${id}r"><input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="${lb}" oninput="pinUp('${id}')" onfocus="pinUp('${id}')" onblur="pinUp('${id}')"><span class="pb"></span><span class="pb"></span><span class="pb"></span><span class="pb"></span></div>`;
function pinUp(id){const el=document.getElementById(id),r=document.getElementById(id+"r");if(!el||!r)return;el.value=el.value.replace(/\D/g,"").slice(0,4);const n=el.value.length,f=document.activeElement===el;[...r.children].slice(1).forEach((b,i)=>{b.className="pb"+(i<n?" f":"")+(f&&i===Math.min(n,3)?" a":"")})}
function pinShake(){document.querySelectorAll(".pinr").forEach(r=>{r.classList.remove("shk");void r.offsetWidth;r.classList.add("shk")});if(vbOn()&&navigator.vibrate)try{navigator.vibrate([60,40,60])}catch(e){}}
function pinClr(){["pin","pin2"].forEach(id=>{const e=document.getElementById(id);if(e){e.value="";pinUp(id)}});const p=document.getElementById("pin");if(p)p.focus()}

boot();

</script>
